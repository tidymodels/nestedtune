# Watches vctrs' development branch, because one invariant of this package
# rests on a generic vctrs marks experimental.
#
# `vec_cbind_frame_ptype.nested_results()` (R/nested-results.R) is a method on
# `vctrs::vec_cbind_frame_ptype()`, which vctrs documents as experimental. If
# that generic is renamed, removed or given different semantics upstream, a
# `vec_cbind()` on a results object silently stops restoring the class, and
# nothing in a released-vctrs matrix would notice until the change reached CRAN.
# This leg installs vctrs from `r-lib/vctrs@main` and runs tests against it,
# so a break that the vctrs compatibility tests catch surfaces on the next
# push or pull request here rather than at the upstream release. It also runs once a week (the `schedule:` below,
# Monday 06:17 UTC -- off the hour, the slot GitHub documents as the most
# delayed under load), so a quiet week here still asks the question of that
# week's upstream commits, and on demand (`workflow_dispatch:`), so an
# upstream change can be checked without a push. GitHub disables a
# `schedule:` after 60 days with no repository activity, so a long dormancy
# still needs the dispatch.
#
# What a run tests depends on its trigger. A push or pull request runs only
# the three vctrs compatibility test files (`test-vctrs-compat.R`,
# `test-dplyr-compat.R`, `test-nested-results-set-compat.R`; the `filter` in
# the last step). The weekly schedule runs the whole suite, because a
# development-vctrs break can reach files outside the three: other test files
# call vctrs functions too (`test-nested-tune-bayes-oracles.R` calls
# `vec_cbind_frame_ptype()`), and dplyr and tibble build on vctrs. A dispatch
# runs the whole suite unless its `full` input is set to false.
#
# The `cache-version: devel-vctrs` on the dependency step keys this leg's
# library cache apart from every other workflow's. The action saves its cache
# after the job, by which point vctrs has been overwritten with the
# development branch below, and the restore key of a sibling job on the same
# runner image and R version would otherwise match it. The cache is saved only
# on a key miss, so the development vctrs inside it stays at whatever commit
# the saving run installed until the dependency hash changes; the install step
# below re-resolves `r-lib/vctrs@main` on every run regardless, and the
# "Record which vctrs" step is what shows which commit a run tested.
#
# It is NOT a gating check. It reports on another project's unreleased branch,
# so a red run here is news rather than a reason this repository's own work
# cannot merge; it is deliberately absent from the default branch's required
# checks.
#
# The `paths-ignore` list meets the same test the other workflows' copies meet:
# a commit touching only `cairn/**`, `CLAUDE.md` or `.claude/**` changes nothing
# the suite can notice. It is spelled out under both triggers because GitHub
# Actions does not resolve YAML anchors in workflow files; `.github/ci-usage.py`
# reads every copy back separately -- both triggers here and both in every other
# workflow carrying them -- and exits non-zero if any two disagree.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
      - 'CLAUDE.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'cairn/**'
      - 'CLAUDE.md'
      - '.claude/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the whole suite (false runs the three vctrs test files)'
        type: boolean
        default: true

name: devel-vctrs.yaml

# Narrower than the sibling workflows' `read-all`, because this is the one job
# that builds and runs another project's unreleased HEAD: checkout needs
# `contents`, and nothing here reads actions, checks or issues; the dependency
# cache the job saves needs no scope of its own. The
# `GITHUB_PAT` in the job `env:` below is kept so `pak` makes authenticated
# reads against GitHub's API rather than hitting the anonymous rate limit; it
# is the same read-scoped token these permissions bound.
permissions:
  contents: read

# Extends the block in R-CMD-check.yaml. Keyed on the workflow as well as
# the ref, so cancelling a superseded run of this leg never touches a check run.
# Also keyed on the test step's `FULL_SUITE` switch (the same expression), so a
# three-file run never cancels or replaces a pending or running whole-suite
# run: GitHub keeps one pending run per group and cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test-devel-vctrs:
    runs-on: ubuntu-latest

    # One job cap rather than R-CMD-check.yaml's two scopes: this leg runs no
    # `R CMD check`, so there is no check step to bound separately. The leg's
    # first green run took 35m24s end to end, 33m19s of it in the suite (run
    # 34526174374, 2026-09-10) -- longer than the ubuntu release leg's whole
    # 23m42s job on the same day, the suite paying here for what `R CMD check`
    # runs under its own harness there. 90 is about 2.5x the measurement, the
    # ratio R-CMD-check.yaml and R-CMD-check-hard.yaml both use. It is a hang
    # guard, not headroom: a run approaching it is a suite to make faster. The
    # cap is sized for the whole-suite runs; a three-file run took 2m38s end to
    # end, 20s of it in the test step (job 120134601264 of run 39867888167,
    # 2026-10-22).
    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # See R-CMD-check.yaml: test files run in parallel, one worker per core,
      # and this leg runs on ubuntu alone (4 vCPUs). Unset, testthat would use 2.
      TESTTHAT_CPUS: 4
      # `test_local()` does not set this the way `devtools::test()` does, and
      # the suite's daemon and timing tests skip without it.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check
          cache-version: devel-vctrs

      # After the dependency install, so the released vctrs it pulls in as an
      # Import is overwritten rather than installed on top of the development
      # one.
      - name: Install vctrs from its development branch
        run: pak::pak("r-lib/vctrs@main")
        shell: Rscript {0}

      # The run's verdict is about whichever upstream commit this run got, so
      # the run's own log has to name it -- a red run read months later is
      # unreadable without it.
      - name: Record which vctrs this run tested against
        run: |
          desc <- utils::packageDescription("vctrs")
          for (field in c("Version", "RemoteRef", "RemoteSha", "Packaged")) {
            cat(field, ": ", format(desc[[field]]), "\n", sep = "")
          }
        shell: Rscript {0}

      # testthat matches `filter` against each file name with `test-` and `.R`
      # removed. A NULL filter runs every file.
      - name: Run the tests against it
        env:
          FULL_SUITE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
        run: |
          full <- identical(Sys.getenv("FULL_SUITE"), "true")
          cat("Whole suite: ", full, "\n", sep = "")
          filter <- if (full) {
            NULL
          } else {
            "^(vctrs-compat|dplyr-compat|nested-results-set-compat)$"
          }
          pkgload::load_all(".", quiet = TRUE)
          testthat::test_local(filter = filter, stop_on_failure = TRUE)
        shell: Rscript {0}
