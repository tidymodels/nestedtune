# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# A commit touching only these changes nothing the package can notice, so the
# run it would fire has nothing to learn. `paths-ignore` on `push` is where the
# saving is -- on `pull_request` GitHub evaluates it against the whole PR diff,
# not the pushed commit, so it fires only for a PR that is tracking-only end to
# end. `.claude/**` is untracked today and listed for the day it is not.
#
# The list is spelled out under both triggers because GitHub Actions does not
# resolve YAML anchors in workflow files; `.github/ci-usage.py` reads every
# copy back separately -- both triggers here and both in every other workflow
# carrying the filter -- and exits non-zero if any two of them disagree.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
      - 'CLAUDE.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'cairn/**'
      - 'CLAUDE.md'
      - '.claude/**'

name: R-CMD-check.yaml

permissions: read-all

# A push supersedes the run before it, whose answer is now about a commit
# nobody is waiting on. Cancel it -- except on the default branch, which is a
# distribution channel: every commit there keeps a completed check rather than
# a cancelled one. `github.ref` is `refs/pull/<n>/merge` on a pull request, so
# each PR gets its own group and pushes to the same PR cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    # Two caps at two scopes, and they differ on purpose.
    #
    # 30 minutes, on the `check-r-package` step below: a run that hangs is a
    # run nobody gets an answer from, and both observed hangs were inside
    # `test_check("nestedtune")` on a tree that had passed an hour earlier --
    # 52 minutes under `R CMD check` on macOS, which is this workflow's check
    # step, and 40 minutes under `covr` on ubuntu, which is `test-coverage`'s
    # (that workflow caps its own job at 20). The bound stays on the code both
    # hangs were in. It was 20 until 2026-09-02, when the suite outgrew it:
    # the windows check step had run 13.2, 16.3 and 17.9 minutes on the last
    # three default-branch runs, and the M48 branch, adding tests measured at
    # 85 s locally, was killed at 20 on three consecutive runs mid-suite with
    # no testthat output written (run 33664382061). 30 keeps the step bound
    # under the 52-minute hang it was cut against while leaving the slowest
    # leg roughly 10 minutes of headroom; it is still not free headroom, and a
    # leg that approaches it again is the suite asking to be made faster
    # rather than the cap asking to be raised. The devel leg approached it
    # first: on 2026-09-06 its step ran the tests in 18 minutes and the
    # vignette rebuild in 3 on the default branch, finishing about 90 seconds
    # under 30, and the M72 branch's two added minutes of tests pushed it over
    # (job 101620541844 of run 34082554608, killed inside the vignette
    # rebuild after the tests had passed). Windows followed on the next run:
    # its tests took 14 minutes on the default branch and 18 then 19 on the
    # M72 branch, the step passing once with 30 seconds to spare and then
    # timing out inside the same vignette rebuild (job 101627605935 of run
    # 34085134425). Those two legs got 40 at M72's review gate, over trimming
    # the suite, and keep it after M74 (2026-09-07) made the suite faster:
    # every hand-rolled reference loop served from the fixture cache, the
    # test blocks that reran one orchestrator call merged, one daemon pool
    # shared across the parallel-identity blocks instead of 26 restarts, and
    # the help-page examples cut to two-by-two folds. Measured serially on
    # the maintainer's machine at 294ca2b by benchmarks/profile-tests.R, the
    # suite went from 704-711 s at the branch point to 623 s, and the
    # examples (benchmarks/time-examples.R, with \donttest) from 28 s to
    # 16 s. Three attempts of 294ca2b ran the windows step at 26.6, 28.0 and
    # 27.2 minutes (its check-time vignette rebuild alone 197-240 s, against
    # 125-157 s on the two default-branch runs before it) and devel at 17.8,
    # 23.2 and 26.4, so both stayed at 40.
    #
    # Devel came back to 30 at M76, on three attempts of branch head 3b313dd
    # (run 34287906467) -- a head whose package content is the default
    # branch's, benchmarks/ being .Rbuildignore'd. The runs themselves ran on
    # the pull-request merge ref, whose sha is not stable and is not recorded
    # here for that reason. Step minutes, per leg, in attempt order, medians in
    # brackets: windows 19.7, 25.7, 25.3 [25.3]; devel 20.8, 18.8, 23.7
    # [20.8]; macOS 19.5, 17.4, 19.3 [19.3]; oldrel-1 16.0, 17.6, 24.5
    # [17.6]; ubuntu release 17.8, 19.0, 22.7 [19.0]. So devel joins the
    # three legs at 30 and windows alone keeps 40 -- the spread within a leg
    # is up to 8.5 minutes across three attempts, which is why the cap is set
    # from a median of three rather than one reading, and why 30 on a
    # 20.8-minute median is not generous. M76 also priced the two test-suite
    # levers that were meant to buy the windows leg its 30 -- splitting
    # test-parallel-identity.R at its pool boundaries, and re-ordering
    # Config/testthat/start-first -- and reverted both: re-ordering measured
    # 2.4% slower on non-overlapping ranges, and the split bought nothing while
    # adding a daemon-pool start per file. The branch point's wall clock sits
    # 1.9% above the makespan floor its own per-file occupancy implies at four
    # workers, so there is no idle worker time for a re-ordering to recover
    # (benchmarks/test-timing-parallel.md, which also states what those figures
    # do not settle).
    # Bringing windows under 24 too is a ROADMAP candidate, now waiting on
    # the check-time vignette rebuild rather than on a test-suite lever.
    #
    # 60 minutes, on the job: the devel leg gets no Linux binaries and builds
    # every dependency from source. A 20-minute job cap killed it mid-`Building
    # vdiffr`, 114 of the 129 packages started, ~19 minutes into
    # `setup-r-dependencies` (job 99321348438 of run 33335421506, 2026-08-30) --
    # and the kill landed before `R package cache save`, so the cache that
    # would make the next run warm (9m28s, measured 2026-08-01) could never be
    # written, and every run paid the cold build again. The first cold run to
    # survive took 23m34s end to end (job 99334129149 of run 33340129444), so
    # 60 is about 2.5x that and one slow runner does not re-open the deadlock.
    # What the split gives up: every step that is not the check -- checkout,
    # `setup-r-dependencies`, cache save -- is now bounded only by this
    # 60-minute job cap, on all five legs, where the old single cap ended a
    # stall anywhere in 20. The step cap still ends a hung test suite -- in 30
    # on four legs, 40 on windows.
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Test files run in parallel (`Config/testthat/parallel: true`), one
      # worker per runner core: GitHub's standard runners give a public
      # repository 4 vCPUs on ubuntu and windows and 3 on the arm64 macOS
      # image (read 2026-09-03 from the hosted-runner sizes page). testthat
      # defaults to 2 when this is unset, which leaves half the cores idle.
      TESTTHAT_CPUS: ${{ matrix.config.os == 'macos-latest' && 3 || 4 }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # P3M's macOS binaries are built with OpenMP enabled, but the runners
          # have no libomp, so e.g. gower fails to load. CRAN's own macOS
          # binaries are built without it, so use those instead.
          use-public-rspm: ${{ matrix.config.os != 'macos-latest' }}

      # The macOS leg alone builds `gower` on the runner. The RSPM arm64
      # binary (`bin/macosx/sonoma-arm64/contrib/4.6/gower_1.0.2.tgz`) links
      # the OpenMP symbol `___kmpc_barrier`, and the runner image ships no
      # libomp, so `dlopen` of `gower/libs/gower.so` fails with `symbol not
      # found in flat namespace` and takes down the install step of
      # `R CMD build` -- observed in job 99324307884 of run 33336519275.
      # `gower` is a transitive Suggests dependency, reached through
      # `recipes`, so no package code can route around it. `?source` is pak's
      # per-package parameter: it builds this one package and leaves every
      # other package here, and all four other legs, on the binary path they
      # already resolve through.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ matrix.config.os == 'macos-latest' && 'any::rcmdcheck, gower?source' || 'any::rcmdcheck' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        timeout-minutes: ${{ matrix.config.os == 'windows-latest' && 40 || 30 }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
