# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# See the matching block in R-CMD-check.yaml; every copy of this list must stay
# identical, which `.github/ci-usage.py` enforces by comparing each block it
# parses against the others and refusing to run when they differ.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
      - 'CLAUDE.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'cairn/**'
      - 'CLAUDE.md'
      - '.claude/**'

name: test-coverage.yaml

permissions: read-all

# See the matching block in R-CMD-check.yaml. Keyed on the workflow as well as
# the ref, so cancelling a superseded check never touches a coverage run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    # covr has hung inside test_check() here before, and a hung job is worse
    # than a failed one. R-CMD-check bounds the same risk on its check step
    # rather than on its job -- at 30 minutes, 40 on windows -- because its
    # devel leg needs a long job cap for a from-source dependency build, and
    # this workflow's single ubuntu release leg gets binaries and needs no such
    # thing.
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # See R-CMD-check.yaml: one test worker per core, and this job runs on
      # ubuntu alone. covr runs tests/testthat.R in a subprocess that inherits
      # the job's environment, so the setting reaches testthat unchanged.
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      # tests/testthat/helper-covr.R points COVERAGE_DIR at the sidecar directory
      # below, so the test workers and the daemons they start write their trace
      # files there instead of into install_path, where a daemon killed inside
      # covr's exit finalizer once left a truncated file that broke the merge
      # inside package_coverage(). The sidecar is merged here, skipping any file
      # that cannot be read: a killed daemon costs its own counts, not the job.
      # merge_coverage() is covr's own internal merge, applied to the same
      # objects it would have read itself. The directory name is shared with
      # that helper; change both together.
      - name: Test coverage
        run: |
          install_path <- file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = install_path
          )
          sidecar <- list.files(
            file.path(install_path, "daemon-traces"),
            pattern = "^covr_trace_",
            full.names = TRUE
          )
          traces <- lapply(sidecar, function(f) {
            tryCatch(as.list(readRDS(f)), error = function(e) NULL)
          })
          skipped <- sidecar[vapply(traces, is.null, logical(1))]
          if (length(skipped)) {
            message("skipped unreadable trace file(s): ", paste(basename(skipped), collapse = ", "))
          }
          message(length(sidecar) - length(skipped), " sidecar trace file(s) merged")
          cov <- covr:::merge_coverage(c(list(cov), Filter(Negate(is.null), traces)))
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
