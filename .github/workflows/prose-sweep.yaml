# The prose sweep as a check a pull request meets: every gating mode of
# `benchmarks/sweep-prose.R` over the guides, README.Rmd and the roxygen
# sources, red on any hit. The same six invocations run locally from
# tests/testthat/test-sweep-prose.R; under `R CMD check` that test skips,
# because the built tarball carries no `benchmarks/`, so this workflow is the
# leg that runs on a PR opened without a local test run. No status check is
# required by branch protection here; what stops a red run merging is the
# merge clause in cairn/PROFILE.md (never merge red or pending CI).
#
# See the matching block in R-CMD-check.yaml; every copy of this list must stay
# identical, which `.github/ci-usage.py` enforces by comparing each block it
# parses against the others and refusing to run when they differ.
#
# Unlike the other workflows, `push` here carries no `branches` filter: the
# job costs about a minute, and a PR opens only at the merge gate, so a sweep
# on every branch push is what tells the author about a hit before then. The
# concurrency block below keeps a burst of pushes to one branch at one run.
on:
  push:
    paths-ignore:
      - 'cairn/**'
      - 'CLAUDE.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'cairn/**'
      - 'CLAUDE.md'
      - '.claude/**'

name: prose-sweep.yaml

permissions: read-all

# See the matching block in R-CMD-check.yaml. Keyed on the workflow as well as
# the ref, so cancelling a superseded sweep never touches another check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  prose-sweep:
    runs-on: ubuntu-latest
    # The script is base R with no package dependency, so the job is a
    # checkout, an R install and six short runs. The six invocations took
    # 1.4 s together on the maintainer's machine at 8b4c2eb (2026-09-11),
    # and the whole job ran in 46 s on e5f7d40 (job 103440877732 of run
    # 34653536495, 2026-09-11); 10 is a hang cap, not headroom.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      # One step per mode, so a red run names the mode on the job summary.
      # Every mode runs even after an earlier one hits, so one red run reports
      # the whole extent; the job stays red because a failed step fails it.
      #
      # `benchmarks/sweep-prose.R` owns the list: its `gating` vector is the
      # one declaration, and `Rscript benchmarks/sweep-prose.R --list-gating`
      # prints it, one command per line, in this order. The steps below are
      # the one accepted copy of it, kept so the job summary names the mode
      # that went red. A step added, removed or reworded here is checked
      # against `--list-gating` by hand.
      - name: Sentence length (pages)
        run: Rscript benchmarks/sweep-prose.R

      - name: Backtick spans (pages)
        if: ${{ !cancelled() }}
        run: Rscript benchmarks/sweep-prose.R --spans

      - name: Plain clauses (pages)
        if: ${{ !cancelled() }}
        run: Rscript benchmarks/sweep-prose.R --plain

      - name: Sentence length (roxygen)
        if: ${{ !cancelled() }}
        run: Rscript benchmarks/sweep-prose.R --roxygen

      - name: Backtick spans (roxygen)
        if: ${{ !cancelled() }}
        run: Rscript benchmarks/sweep-prose.R --roxygen --spans

      - name: Plain clauses (roxygen)
        if: ${{ !cancelled() }}
        run: Rscript benchmarks/sweep-prose.R --roxygen --plain
